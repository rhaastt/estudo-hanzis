<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>Guia de Estudo — Hanzis Essenciais</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/guide.css">
  <link rel="stylesheet" href="css/flashcards.css">
  <link rel="stylesheet" href="css/quiz.css">
  <link rel="stylesheet" href="css/paises.css">
  <link rel="stylesheet" href="css/modals.css">
  <link rel="stylesheet" href="css/baralhos.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>

<header class="hero">
  <h1>Hanzis<br><em>Essenciais</em></h1>
  <p id="heroSubtitle">72 caracteres · Guia de estudo + Flash Cards interativos</p>
</header>

<div class="tabs" id="tabsContainer">
  <button class="tab-btn active" data-tab="flashcards">Flash Cards</button>
  <button class="tab-btn" data-tab="guia">Guia de Estudo</button>
  <button class="tab-btn" data-tab="quiz">Quiz</button>
  <button class="tab-btn" data-tab="paises">Países</button>
  <div class="tab-auth-wrap" id="authWrap">
    <!-- estado deslogado -->
    <button class="tab-auth-btn" id="authBtn" aria-label="Entrar">
      <i data-lucide="user"></i>
      <span class="tab-auth-label">Entrar</span>
    </button>
    <!-- estado logado: avatar + dropdown -->
    <div class="user-avatar-wrap" id="userAvatarWrap" hidden>
      <button class="user-avatar-btn" id="userAvatarBtn" type="button" aria-haspopup="true" aria-expanded="false">
        <img class="user-avatar-img" id="userAvatarImg" alt="" hidden>
        <span class="user-avatar-initials" id="userAvatarInitials"></span>
      </button>
      <div class="user-dropdown" id="userDropdown" hidden>
        <div class="user-dropdown-header">
          <p class="user-dropdown-name" id="userDropdownName"></p>
          <p class="user-dropdown-email" id="userDropdownEmail"></p>
        </div>
        <div class="user-dropdown-divider"></div>
        <button class="user-dropdown-item" id="userProfileBtn" type="button">
          <i data-lucide="settings"></i>Perfil e configurações
        </button>
        <button class="user-dropdown-item user-dropdown-item--danger" id="userSignOutBtn" type="button">
          <i data-lucide="log-out"></i>Sair
        </button>
      </div>
    </div>
  </div>
  <button class="tab-search-btn" id="globalSearchBtn" aria-label="Buscar">
    <i data-lucide="search"></i>
    <span class="tab-search-hint">Ctrl K</span>
  </button>
</div>

<div id="flashcards" class="section active">
  <div class="flashcards-wrap">
    <div class="fc-progress-bar">
      <div class="fc-progress-fill" id="progressFill"></div>
    </div>
    <div class="fc-meta">
      <span class="fc-counter" id="fcCounter">0 / 0 virados</span>
      <div class="fc-filter" id="filterContainer"></div>
    </div>
    <div class="baralho-panel" id="baralhoContainer"></div>
    <div class="fc-grid" id="fcGrid"></div>
    <div id="sentinel"></div>
    <div class="fc-reset-wrap">
      <button class="btn-reset" id="resetBtn">Reiniciar todos os cards</button>
    </div>
  </div>
</div>

<div id="guia" class="section">
  <div class="guide-wrap" id="guideContainer"></div>
</div>

<div id="quiz" class="section">
  <div class="quiz-wrap" id="quizContainer"></div>
</div>

<div id="paises" class="section">
  <div class="paises-wrap" id="paisesContainer"></div>
</div>

<footer>
  72 hanzis · nível iniciante · mandarin essentials
</footer>

<div class="cmdk" id="cmdk" hidden>
  <div class="cmdk-backdrop" data-cmdk-close></div>
  <div class="cmdk-panel" role="dialog" aria-modal="true" aria-label="Busca global">
    <div class="cmdk-input-row">
      <i data-lucide="search" class="cmdk-input-icon"></i>
      <input type="search" id="cmdkInput" placeholder="Buscar hanzi, pinyin, tradução, país…" autocomplete="off" autocapitalize="off" spellcheck="false">
      <kbd class="cmdk-esc">esc</kbd>
    </div>
    <div class="cmdk-results" id="cmdkResults"></div>
    <div class="cmdk-footer">
      <span><kbd>enter</kbd> abrir</span>
      <span><kbd>↑</kbd><kbd>↓</kbd> navegar</span>
    </div>
  </div>
</div>

<!-- ── MODAL DE AUTH ──────────────────────────────────────── -->
<div class="auth-modal" id="authModal" hidden>
  <div class="auth-modal-backdrop" id="authModalBackdrop"></div>
  <div class="auth-modal-card" role="dialog" aria-modal="true" aria-labelledby="authModalTitle">
    <button class="auth-modal-close" type="button" id="authModalClose" aria-label="Fechar">
      <i data-lucide="x"></i>
    </button>
    <div class="auth-tabs">
      <button class="auth-tab active" data-auth-tab="login" type="button">Entrar</button>
      <button class="auth-tab" data-auth-tab="signup" type="button">Criar conta</button>
    </div>

    <button class="auth-google" id="authGoogle" type="button">
      <svg class="auth-google-icon" viewBox="0 0 18 18" width="18" height="18" aria-hidden="true">
        <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62z"/>
        <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.8.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.33A9 9 0 0 0 9 18z"/>
        <path fill="#FBBC05" d="M3.97 10.72a5.4 5.4 0 0 1 0-3.44V4.95H.96a9 9 0 0 0 0 8.1l3.01-2.33z"/>
        <path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58A9 9 0 0 0 .96 4.95l3.01 2.33C4.68 5.16 6.66 3.58 9 3.58z"/>
      </svg>
      <span>Continuar com Google</span>
    </button>

    <div class="auth-divider"><span>ou</span></div>

    <form class="auth-form" id="authForm" autocomplete="on">
      <div class="auth-field auth-field--signup" hidden>
        <label class="auth-label" for="authNome">Nome</label>
        <input class="auth-input" id="authNome" type="text" name="name"
               placeholder="Como devemos te chamar?" autocomplete="name" maxlength="60">
      </div>

      <div class="auth-field">
        <label class="auth-label" for="authEmail">E-mail</label>
        <input class="auth-input" id="authEmail" type="email" name="email"
               placeholder="seu@email.com" required autocomplete="email">
      </div>

      <div class="auth-field">
        <label class="auth-label" for="authPassword">Senha</label>
        <div class="auth-input-wrap">
          <input class="auth-input" id="authPassword" type="password" name="password"
                 placeholder="••••••••" required autocomplete="current-password">
          <button class="auth-toggle" id="authToggle" type="button" aria-label="Mostrar senha">
            <i data-lucide="eye"></i>
          </button>
        </div>
        <div class="auth-strength auth-field--signup" id="authStrength" hidden>
          <div class="auth-strength-bar"><span id="authStrengthFill"></span></div>
          <span class="auth-strength-label" id="authStrengthLabel"></span>
        </div>
      </div>

      <div class="auth-field auth-field--signup" hidden>
        <label class="auth-label" for="authPassword2">Confirmar senha</label>
        <input class="auth-input" id="authPassword2" type="password" name="password2"
               placeholder="••••••••" autocomplete="new-password">
      </div>

      <p class="auth-msg" id="authMsg"></p>
      <button class="auth-submit" id="authSubmit" type="submit">Entrar</button>
    </form>

    <div class="auth-sent" id="authSent" hidden>
      <i data-lucide="mail-check" class="auth-sent-icon"></i>
      <p class="auth-sent-title">Confirme seu e-mail</p>
      <p class="auth-sent-text">Enviamos um link de confirmação para <strong id="authSentEmail"></strong>. Abra-o para ativar sua conta.</p>
      <button class="auth-link" id="authResend" type="button">Reenviar e-mail</button>
    </div>

    <!-- painel de perfil (visível quando logado e modal aberto via "Perfil") -->
    <div class="auth-profile" id="authProfile" hidden>
      <!-- Hero horizontal: avatar + identidade -->
      <div class="auth-profile-hero">
        <div class="auth-profile-avatar" id="authProfileAvatar"></div>
        <div class="auth-profile-identity">
          <p class="auth-profile-name" id="authProfileName"></p>
          <p class="auth-profile-email" id="authProfileEmail"></p>
          <span class="auth-profile-provider" id="authProfileProvider" hidden></span>
        </div>
      </div>

      <!-- Estatísticas -->
      <div class="auth-profile-stats" id="authProfileStats"></div>

      <!-- Editar nome -->
      <div class="auth-profile-field">
        <label class="auth-label" for="profileNomeInput">Nome de exibição</label>
        <div class="auth-profile-name-row">
          <input class="auth-input" id="profileNomeInput" type="text" maxlength="60"
                 placeholder="Seu nome">
          <button class="auth-profile-save" id="profileSaveBtn" type="button">Salvar</button>
        </div>
        <p class="auth-msg" id="profileMsg"></p>
      </div>

      <!-- Ações -->
      <div class="auth-profile-actions">
        <button class="auth-profile-signout" id="profileSignOutBtn" type="button">
          <i data-lucide="log-out"></i> Sair da conta
        </button>
      </div>
    </div>
  </div>
</div>

<div class="baralho-modal" id="baralhoModal" hidden>
  <div class="baralho-modal-backdrop" data-bm-close></div>
  <div class="baralho-modal-card" role="dialog" aria-modal="true" aria-labelledby="bmTitle">
    <h3 class="baralho-modal-title" id="bmTitle"></h3>
    <p class="baralho-modal-text" id="bmText" hidden></p>
    <input class="baralho-modal-input" id="bmInput" type="text" maxlength="40"
           placeholder="Ex: Verbos difíceis" autocomplete="off">
    <p class="baralho-modal-msg" id="bmMsg"></p>
    <div class="baralho-modal-actions">
      <button class="baralho-modal-btn baralho-modal-btn--ghost" data-bm-close type="button">Cancelar</button>
      <button class="baralho-modal-btn baralho-modal-btn--primary" id="bmConfirm" type="button">Salvar</button>
    </div>
  </div>
</div>

<div class="hw-modal" id="hwModal" hidden>
  <div class="hw-modal-backdrop" data-hw-close></div>
  <div class="hw-modal-card" role="dialog" aria-modal="true" aria-labelledby="hwModalHanzi">
    <button class="hw-modal-close" type="button" data-hw-close aria-label="Fechar">
      <i data-lucide="x"></i>
    </button>
    <div class="hw-modal-pinyin" id="hwModalPinyin"></div>
    <div class="hw-modal-canvas" id="hwModalCanvas"></div>
    <div class="hw-modal-translation" id="hwModalTranslation"></div>
    <div class="hw-modal-hint" id="hwModalHint"></div>
    <div class="hw-modal-actions">
      <button class="hw-btn" type="button" id="hwAnimate"><i data-lucide="play"></i> Animar</button>
      <button class="hw-btn" type="button" id="hwPractice"><i data-lucide="pencil"></i> Praticar</button>
    </div>
  </div>
</div>

<nav class="mobile-nav" id="mobileNav">
  <button class="mobile-nav-btn active" data-tab="flashcards">
    <i data-lucide="layers"></i>
    <span>Cards</span>
  </button>
  <button class="mobile-nav-btn" data-tab="guia">
    <i data-lucide="book-open"></i>
    <span>Guia</span>
  </button>
  <button class="mobile-nav-btn" data-tab="quiz">
    <i data-lucide="brain"></i>
    <span>Quiz</span>
  </button>
  <button class="mobile-nav-btn" data-tab="paises">
    <i data-lucide="globe"></i>
    <span>Países</span>
  </button>
  <button class="mobile-nav-btn" id="mobileSearchBtn" aria-label="Buscar">
    <i data-lucide="search"></i>
    <span>Buscar</span>
  </button>
  <button class="mobile-nav-btn mobile-nav-btn--auth" id="mobileAuthBtn" aria-label="Perfil">
    <span class="mobile-nav-avatar" id="mobileNavAvatar">
      <img class="mobile-nav-avatar-img" id="mobileNavAvatarImg" alt="" hidden>
      <i data-lucide="user" id="mobileNavUserIcon"></i>
    </span>
    <span id="mobileAuthLabel">Entrar</span>
  </button>
</nav>

<script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
<script type="module" src="js/app.js"></script>
<script type="module" src="js/quiz.js"></script>
</body>
</html>
